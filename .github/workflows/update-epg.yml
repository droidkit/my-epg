name: Update EPG

on:
  schedule:
    - cron: '0 0 * * *'      # каждый день в 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'requests>=2.31,<3'

      - name: Generate epg.xml
        run: python update_epg.py

      - name: Validate epg.xml (no duplicate / overlapping programmes)
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from collections import Counter

          def strip_ns(tag):
              return tag.split("}", 1)[1] if "}" in tag else tag

          def to_sec(s):
              import re
              m = re.match(r"^(\d{14})(?:\s*([+-]\d{4}))?$", (s or "").strip())
              if not m:
                  return None
              try:
                  dt = datetime.strptime(m.group(1), "%Y%m%d%H%M%S")
              except ValueError:
                  return None
              tz = m.group(2)
              if tz:
                  sign = 1 if tz[0] == "+" else -1
                  dt = dt.replace(tzinfo=timezone(
                      sign * timedelta(hours=int(tz[1:3]), minutes=int(tz[3:5]))
                  ))
              else:
                  dt = dt.replace(tzinfo=timezone.utc)
              return int(dt.timestamp())

          try:
              root = ET.parse("epg.xml").getroot()
          except ET.ParseError as e:
              sys.exit(f"epg.xml is not valid XML: {e}")

          progs = []
          for el in root:
              if strip_ns(el.tag) != "programme":
                  continue
              ch = el.get("channel")
              s = to_sec(el.get("start"))
              e = to_sec(el.get("stop"))
              if ch and s is not None and e is not None and e > s:
                  progs.append((ch, s, e))

          print(f"programmes parsed: {len(progs)}")

          # 1) Дубли по (channel, start)
          counter = Counter((ch, s) for ch, s, _ in progs)
          dups = {k: v for k, v in counter.items() if v > 1}
          print(f"duplicates_(channel,start): {len(dups)}")
          if dups:
              for k, v in list(dups.items())[:20]:
                  print("  DUP", k, "x", v)

          # 2) Пересечения интервалов в рамках одного канала
          by_ch = {}
          for ch, s, e in progs:
              by_ch.setdefault(ch, []).append((s, e))
          overlaps = 0
          for ch, lst in by_ch.items():
              lst.sort()
              for i in range(1, len(lst)):
                  if lst[i][0] < lst[i - 1][1]:
                      overlaps += 1
                      if overlaps <= 20:
                          print(f"  OVERLAP channel={ch} "
                                f"{lst[i-1]} vs {lst[i]}")
          print(f"overlaps: {overlaps}")

          if dups or overlaps:
              sys.exit("epg.xml contains duplicate / overlapping programmes")
          print("OK: no duplicates, no overlaps")
          PY

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add epg.xml
          git diff --staged --quiet || git commit -m "Update EPG [skip ci]"
          git push
