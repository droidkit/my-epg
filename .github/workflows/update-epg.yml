name: Update EPG

on:
  schedule:
    - cron: '0 0 * * *'      # каждый день в 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'requests>=2.31,<3'

      - name: Generate epg.xml
        run: python update_epg.py

      - name: Validate epg.xml (no duplicate programmes per channel+start)
        run: |
          python3 - <<'PY'
          import re, sys, collections
          data = open("epg.xml", encoding="utf-8").read()
          progs = re.findall(
              r'<programme start="([^"]+)"[^>]*stop="([^"]+)"[^>]*channel="([^"]+)"',
              data,
          )
          seen = collections.Counter((ch, st) for st, sp, ch in progs)
          dups = {k: v for k, v in seen.items() if v > 1}
          print(f"programmes={len(progs)} duplicate_(channel,start)={len(dups)}")
          if dups:
              for k, v in list(dups.items())[:20]:
                  print("  DUP", k, "x", v)
              sys.exit("epg.xml contains duplicate programmes")
          PY

      - name: Validate epg.xml (no overlapping programmes per channel)
        run: |
          python3 - <<'PY'
          import re, sys
          from datetime import datetime, timedelta, timezone
          data = open("epg.xml", encoding="utf-8").read()
          progs = re.findall(
              r'<programme start="([^"]+)"[^>]*stop="([^"]+)"[^>]*channel="([^"]+)"',
              data,
          )
          def to_sec(s):
              m = re.match(r"^(\d{14})(?:\s*([+-]\d{4}))?$", s.strip())
              if not m: return None
              try:
                  dt = datetime.strptime(m.group(1), "%Y%m%d%H%M%S")
              except ValueError:
                  return None
              tz = m.group(2)
              if tz:
                  sign = 1 if tz[0] == "+" else -1
                  dt = dt.replace(tzinfo=timezone(sign * timedelta(hours=int(tz[1:3]), minutes=int(tz[3:5]))))
              else:
                  dt = dt.replace(tzinfo=timezone.utc)
              return int(dt.timestamp())
          by_ch = {}
          for st, sp, ch in progs:
              s, e = to_sec(st), to_sec(sp)
              if s is None or e is None: continue
              by_ch.setdefault(ch, []).append((s, e))
          bad = 0
          for ch, lst in by_ch.items():
              lst.sort()
              for i in range(1, len(lst)):
                  if lst[i][0] < lst[i-1][1]:
                      bad += 1
                      if bad <= 20:
                          print(f"  OVERLAP channel={ch} {lst[i-1]} vs {lst[i]}")
          print(f"overlaps={bad}")
          if bad:
              sys.exit("epg.xml contains overlapping programmes")
          PY

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add epg.xml
          git diff --staged --quiet || git commit -m "Update EPG [skip ci]"
          git push
